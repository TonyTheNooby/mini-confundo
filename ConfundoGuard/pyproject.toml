[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confundoguard"
version = "0.1.0"
description = "Experimental NPAS + AV Filter defense library for stealthy RAG poisoning research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["confundoguard*"]
